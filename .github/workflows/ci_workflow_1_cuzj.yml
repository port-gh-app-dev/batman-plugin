
name: Validate Batman plugin
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate plugin configuration
      run: ./scripts/validate-plugin.sh
    - name: Check shell scripts
      run: ./scripts/format-code.sh
    - name: Run shell syntax checks
      run: find scripts -type f -name '*.sh' -exec bash -n {} +
